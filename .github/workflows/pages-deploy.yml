name: Deploy to GitHub Pages with Extended Timeout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Stage site
        # Thư mục "app luật y tế" là gốc của site. Ghép thêm hoc-test/, 404.html, CNAME từ gốc repo.
        # Bỏ mã nguồn, công cụ, dữ liệu nội bộ và thư mục không phục vụ web để artifact nhẹ hơn.
        # Thư mục audio/ không đưa lên Pages: file giọng được phát từ jsDelivr (nhánh main).
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' --exclude='node_modules' --exclude='.github' \
            --exclude='scripts' --exclude='test' --exclude='docs' --exclude='deploy' \
            --exclude='deliverables' --exclude='output' --exclude='src' \
            --exclude='server.mjs' --exclude='*.log' \
            --exclude='/audio/' \
            "app luật y tế/" _site/
          cp -r hoc-test _site/hoc-test
          cp -r "app luật y tế/hoc-code" _site/hoc-code
          cp 404.html CNAME _site/
          echo "Số file: $(find _site -type f | wc -l)  Dung lượng: $(du -sh _site | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 3600000
