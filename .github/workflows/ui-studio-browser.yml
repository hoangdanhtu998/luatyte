name: UI Studio browser visual checks
on:
  pull_request:
    paths:
      - 'app luật y tế/**'
      - 'hoc-test/**'
      - 'scripts/ui-studio-browser-check.mjs'
      - '.github/workflows/ui-studio-browser.yml'
  push:
    branches: ['feature/ui-studio']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node --check "app luật y tế/ui-studio-prefs.js" && node --check "app luật y tế/ui-studio.js" && node --test test/ui-studio.test.mjs
      - run: node scripts/ui-studio-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-studio-visual-report
          path: ui-studio-report/
          retention-days: 14
