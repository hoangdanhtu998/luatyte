name: QA Hub tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qa-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qa-hub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke, functional, responsive, a11y, performance, security tests
        run: npm test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-hub-report
          path: |
            qa-hub/results/
            qa-hub/playwright-report/
          retention-days: 14

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qa-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qa-hub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lighthouse CI (Core Web Vitals, accessibility)
        run: npm run lhci

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Start app for load test
        run: |
          PORT=3000 node server.js > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health && exit 0
            sleep 1
          done
          cat app.log
          exit 1

      - name: Load test (k6)
        run: npm run k6

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-hub-performance
          path: |
            qa-hub/results/
          retention-days: 14
