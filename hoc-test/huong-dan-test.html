<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Test app Sao Mai · Hướng dẫn từng bước</title>
  <link rel="stylesheet" href="assets/site.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--paper, #F2F2F0); }
    .hd-page { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    .hd-top { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line, #DCDCD8); background: #fff; }
    .hd-top h1 { margin: 0; font-size: 18px; font-weight: 700; flex: 1 1 auto; min-width: 0; }
    .hd-top label { font-size: 14px; color: var(--muted, #5C5F66); }
    .hd-top select { font: inherit; padding: 5px 8px; border-radius: 2px; border: 1px solid #B5B6B2; background: #fff; }
    .hd-top .btn { border-radius: 2px; }

    .hd-grid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 4fr); }
    /* App thu còn 75% để chừa chỗ; iframe rộng/cao hơn 1/0.75 rồi scale lại cho vừa khung */
    .hd-app { position: relative; overflow: hidden; min-width: 0; min-height: 0; background: #E9E9E6; }
    .hd-frame { position: absolute; left: 0; top: 0; width: 133.3333%; height: 133.3333%; border: 0; background: #fff; transform: scale(.75); transform-origin: 0 0; }

    .hd-guide { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: #fff; border-left: 1px solid var(--line, #DCDCD8); }
    .hd-head { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; padding: 10px 16px 12px; border-bottom: 1px solid var(--line, #DCDCD8); }
    .hd-ctrls { flex: 1 1 100%; display: grid; gap: 6px; }
    .hd-ctrls .hd-controls { margin: 0; }
    .hd-head-text { min-width: 0; flex: 1 1 auto; }
    .hd-head .k { font-size: 12px; color: var(--muted, #5C5F66); margin: 0; }
    .hd-head .t { font-size: 16px; font-weight: 700; margin: 2px 0 0; color: var(--ink, #17181C); }

    /* Chọn bước: mở danh sách, bấm để nhảy tới câu đó */
    .hd-picker { position: relative; }
    .hd-picker summary { list-style: none; cursor: pointer; font-size: 14px; font-weight: 600; padding: 7px 12px; border: 1px solid #B5B6B2; border-radius: 2px; background: #fff; white-space: nowrap; }
    .hd-picker summary::-webkit-details-marker { display: none; }
    .hd-picker summary:hover { border-color: var(--ink, #17181C); }
    .hd-steps { position: absolute; right: 0; top: calc(100% + 6px); width: min(360px, 80vw); max-height: 60vh; overflow-y: auto; list-style: none; margin: 0; padding: 6px; background: #fff; border: 1px solid #B5B6B2; border-radius: 2px; box-shadow: 0 8px 24px rgba(23, 24, 28, .14); z-index: 30; }
    .hd-steps li { padding: 8px 10px; font-size: 14px; cursor: pointer; border-radius: 2px; display: flex; gap: 8px; }
    .hd-steps li:hover { background: #F2F2F0; }
    .hd-steps li.cur { background: var(--ink, #17181C); color: #fff; }
    .hd-steps li .n { min-width: 22px; color: var(--muted, #5C5F66); }
    .hd-steps li.cur .n { color: #fff; }
    .hd-steps li.pass .s { color: #1E6B47; }
    .hd-steps li.fail .s { color: #9E3416; }
    .hd-steps li .s { margin-left: auto; font-weight: 700; }

    .hd-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

    /* Khối đề bài và các bước đánh số */
    .hd-q { border-left: 4px solid var(--ink, #17181C); padding: 4px 0 4px 14px; }
    .hd-q h2 { margin: 0 0 6px; font-size: 18px; font-weight: 700; line-height: 1.35; }
    .hd-q p { margin: 0; font-size: 15px; line-height: 1.65; color: var(--ink, #17181C); }
    .hd-blocks { display: grid; gap: 10px; counter-reset: blk; }
    .hd-block { position: relative; padding: 12px 14px 12px 50px; border: 1px solid var(--line, #DCDCD8); border-radius: 2px; background: #FAFAF9; }
    .hd-block::before { counter-increment: blk; content: counter(blk); position: absolute; left: 12px; top: 12px; width: 26px; height: 26px; display: grid; place-items: center; background: var(--ink, #17181C); color: #fff; font-weight: 700; font-size: 13px; border-radius: 2px; }
    .hd-block h3 { margin: 0 0 4px; font-size: 14px; font-weight: 700; }
    .hd-block p { margin: 0; font-size: 15px; line-height: 1.6; }
    .hd-hint { border: 1px solid #E6D7A8; background: #FBF6E4; padding: 12px 14px; border-radius: 2px; }
    .hd-hint h3 { margin: 0 0 6px; font-size: 14px; font-weight: 700; color: #6B4E12; }
    .hd-hint ol { margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.6; }

    .hd-log { display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 10px 12px; border-radius: 2px; line-height: 1.55; background: #F6F7F9; border-left: 3px solid #B5B6B2; font-size: 15px; }
    .msg .who { display: block; font-size: 12px; font-weight: 700; color: #2442C8; margin-bottom: 2px; }
    .msg.step { background: #fff; border: 1px solid var(--line, #DCDCD8); border-left: 3px solid var(--ink, #17181C); font-weight: 700; }
    .msg.step .who { display: none; }
    .msg.bad { border-left-color: #E0722E; }
    .msg.good { border-left-color: #2F9E6A; }
    .hd-summary { margin: 4px 0 0; padding-left: 18px; }
    .hd-owner { font-weight: 700; margin: 8px 0 0; }

    .hd-dock { border-top: 1px solid var(--line, #DCDCD8); padding: 10px 16px 12px; display: grid; gap: 8px; background: #fff; }
    .hd-note { width: 100%; font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid #B5B6B2; border-radius: 2px; box-sizing: border-box; resize: none; height: 44px; }
    .hd-controls { display: flex; flex-wrap: wrap; gap: 6px; }
    .hd-controls .btn { padding: 7px 12px; font-size: 14px; border-radius: 2px; }
    .hd-controls .btn[disabled] { opacity: .45; cursor: not-allowed; }

    .hd-ring { position: fixed; border: 2px solid #2442C8; border-radius: 2px; box-shadow: 0 0 0 4px rgba(36, 66, 200, .12); pointer-events: none; z-index: 50; }
    .hd-ring[hidden] { display: none; }
    .hd-cursor { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; transition: transform .6s cubic-bezier(.3, .7, .3, 1); }
    .hd-cursor svg { display: block; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .25)); transform-origin: 3px 2px; transition: transform .14s; }
    .hd-cursor.press svg { transform: scale(.82); }
    .hd-cursor-tag { position: absolute; left: 22px; top: 22px; white-space: nowrap; font-size: 12px; font-weight: 700; color: #fff; background: #2442C8; border-radius: 2px; padding: 2px 6px; }
    .hd-cursor[hidden] { display: none; }
    .hd-owl { position: fixed; left: 0; top: 0; z-index: 58; pointer-events: none; transition: transform .7s cubic-bezier(.3, .7, .3, 1); }
    .hd-owl[hidden] { display: none; }
    .hd-owl svg { width: 112px; height: 95px; }
    .th-typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
    .th-typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted, #5C5F66); animation: hd-blink 1s ease-in-out infinite; }
    .th-typing i:nth-child(2) { animation-delay: .15s; }
    .th-typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes hd-blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

    .hd-tutor-row { display: flex; gap: 12px; align-items: center; }
    .tutor svg { display: block; overflow: visible; }
    .tut-body { transform-box: view-box; transform-origin: 100px 170px; }
    .tut-lid { transform-box: fill-box; transform-origin: top; }
    .tut-arm { transform-box: view-box; transform-origin: 140px 118px; transition: transform .45s cubic-bezier(.3, .7, .3, 1); }
    .tut-think, .tut-spark, .tut-sweat { opacity: 0; transition: opacity .3s; }
    .tut-think circle { animation: tut-dots 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .tut-think circle:nth-child(2) { animation-delay: .2s; }
    .tut-think circle:nth-child(3) { animation-delay: .4s; }
    .tut-spark { transform-box: fill-box; transform-origin: center; }
    @keyframes tut-dots { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-3px); opacity: 1; } }
    .tutor.idle .tut-body { animation: tut-breathe 2.8s ease-in-out infinite; }
    .tutor .tut-lid { animation: tut-blink 5s infinite; }
    @keyframes tut-breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes tut-blink { 0%, 92%, 100% { transform: scaleY(0); opacity: 0; } 95% { transform: scaleY(1); opacity: 1; } }
    .tutor.point .tut-arm { transform: rotate(-38deg); }
    .tutor.point .tut-body { animation: tut-breathe 2.8s ease-in-out infinite; }
    .tutor.think .tut-body { transform: rotate(-5deg); transition: transform .4s; }
    .tutor.think .tut-think { opacity: 1; }
    .tutor.happy .tut-body { animation: tut-hop .6s ease-out 2; }
    .tutor.happy .tut-spark { opacity: 1; animation: tut-twinkle .8s ease-in-out infinite; }
    @keyframes tut-hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-12px); } 70% { transform: translateY(-4px); } }
    @keyframes tut-twinkle { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.25) rotate(20deg); } }
    .tutor.oops .tut-body { animation: tut-shake .5s ease-in-out 2; }
    .tutor.oops .tut-sweat { opacity: 1; }
    @keyframes tut-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

    @media (max-width: 899px) {
      body { overflow: auto; }
      .hd-page { height: auto; }
      .hd-grid { grid-template-columns: minmax(0, 1fr); }
      .hd-app { height: 60vh; min-height: 420px; }
      .hd-guide { border-left: 0; border-top: 1px solid var(--line, #DCDCD8); }
      .hd-scroll { max-height: 70vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      .th-typing i, .tutor .tut-body, .tutor .tut-lid, .tut-think circle, .tutor.happy .tut-spark { animation: none !important; }
      .tut-arm, .hd-cursor, .hd-cursor svg { transition: none; }
    }
  </style>
</head>
<body>
  <div class="hd-page">
    <header class="hd-top">
      <h1>Test app Phòng khám Sao Mai</h1>
      <label for="hd-build">Bản dựng</label>
      <select id="hd-build">
        <option value="1.0">1.0</option>
        <option value="1.1">1.1</option>
      </select>
      <a class="btn ghost" id="hd-open" href="lab/index.html?build=1.0" target="_blank" rel="noopener">Mở app trong tab mới ↗</a>
      <a class="btn ghost" href="thuc-hanh.html">Về trang thực hành</a>
    </header>

    <div class="hd-grid">
      <section class="hd-app" aria-label="App đang test">
        <iframe class="hd-frame" id="app-frame" title="Phòng khám Sao Mai" src="lab/index.html?build=1.0&embed=1"></iframe>
      </section>

      <aside class="hd-guide" aria-label="Trợ giảng hướng dẫn">
        <div class="hd-head">
          <div class="tutor idle" id="hd-tutor" aria-hidden="true">
            <svg viewBox="0 0 200 170" width="96" height="82">
              <g class="tut-body">
                <path class="tut-ear" d="M56 76 L60 30 L90 58 Z" fill="#1A2F94"/>
                <path class="tut-ear" d="M144 76 L140 30 L110 58 Z" fill="#1A2F94"/>
                <ellipse cx="100" cy="72" rx="50" ry="40" fill="#2442C8"/>
                <ellipse cx="100" cy="80" rx="36" ry="26" fill="#F6E3C4"/>
                <g fill="#FFFFFF" stroke="#17181C" stroke-width="3">
                  <circle cx="82" cy="76" r="12"/>
                  <circle cx="118" cy="76" r="12"/>
                </g>
                <path d="M94 76 Q100 71 106 76" stroke="#17181C" stroke-width="3" fill="none"/>
                <circle cx="82" cy="77" r="5.5" fill="#17181C"/>
                <circle cx="118" cy="77" r="5.5" fill="#17181C"/>
                <circle cx="80" cy="75" r="1.8" fill="#FFFFFF"/>
                <circle cx="116" cy="75" r="1.8" fill="#FFFFFF"/>
                <rect class="tut-lid" x="70" y="64" width="24" height="26" fill="#2442C8" opacity="0"/>
                <rect class="tut-lid" x="106" y="64" width="24" height="26" fill="#2442C8" opacity="0"/>
                <path d="M96 88 L104 88 L100 98 Z" fill="#E0722E"/>
                <ellipse cx="100" cy="128" rx="40" ry="32" fill="#2442C8"/>
                <ellipse cx="100" cy="132" rx="24" ry="22" fill="#F6E3C4"/>
                <rect x="84" y="156" width="12" height="7" rx="3" fill="#E0722E"/>
                <rect x="104" y="156" width="12" height="7" rx="3" fill="#E0722E"/>
                <path d="M60 116 Q44 130 56 146 Q64 132 66 118 Z" fill="#1A2F94"/>
                <g class="tut-arm">
                  <path d="M140 116 Q160 118 166 104 L172 107 Q166 126 142 128 Z" fill="#1A2F94"/>
                  <g class="tut-pointer">
                    <line x1="166" y1="104" x2="192" y2="72" stroke="#17181C" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="192" cy="72" r="4" fill="#E0722E"/>
                  </g>
                </g>
                <g class="tut-think" fill="#98AEFF">
                  <circle cx="150" cy="30" r="3"/>
                  <circle cx="162" cy="20" r="4"/>
                  <circle cx="176" cy="8" r="5"/>
                </g>
                <path class="tut-spark" d="M30 40 L33 48 L41 51 L33 54 L30 62 L27 54 L19 51 L27 48 Z" fill="#E0722E"/>
                <path class="tut-sweat" d="M136 40 Q140 48 136 52 Q132 48 136 40 Z" fill="#7FB8E8"/>
              </g>
            </svg>
          </div>
          <div class="hd-head-text">
            <p class="k" id="hd-count"></p>
            <p class="t" id="hd-now"></p>
          </div>
          <details class="hd-picker">
            <summary>Chọn bước ▾</summary>
            <ol class="hd-steps" id="hd-steps" aria-label="Danh sách bước"></ol>
          </details>
          <div class="hd-ctrls">
            <div class="hd-controls">
              <button class="btn amber" id="hd-demo" type="button">Làm mẫu ▶</button>
              <button class="btn ghost" id="hd-hint" type="button">Gợi ý</button>
              <button class="btn ghost" id="hd-again" type="button">Khoanh lại</button>
              <button class="btn ghost" id="hd-back" type="button">← Quay lại</button>
            </div>
            <div class="hd-controls">
              <button class="btn amber" id="hd-pass" type="button">Đạt ✓</button>
              <button class="btn ghost" id="hd-fail" type="button">Lỗi ✗</button>
              <button class="btn ghost" id="hd-skip" type="button">Bỏ qua</button>
            </div>
          </div>
        </div>

        <div class="hd-scroll" id="hd-scroll">
          <section class="hd-q" id="hd-card" aria-label="Đề bài"></section>
          <div class="hd-log" id="hd-chat" aria-live="polite"></div>
        </div>

        <div class="hd-dock">
          <textarea class="hd-note" id="hd-note" placeholder="Ghi chú: thấy gì, mong đợi gì"></textarea>
        </div>
      </aside>
    </div>
  </div>

  <div class="hd-ring" id="hd-ring" hidden></div>
  <div class="hd-owl tutor idle" id="hd-owl" hidden aria-hidden="true"></div>
  <div class="hd-cursor" id="hd-cursor" hidden aria-hidden="true">
    <svg viewBox="0 0 26 26" width="26" height="26"><path d="M3 2 L3 21 L8 16.5 L11.5 24 L14.5 22.6 L11.2 15.4 L18 15.4 Z" fill="#17181C" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span class="hd-cursor-tag">Trợ giảng</span>
  </div>
  <script src="assets/huong-dan-test.js?v=13"></script>
</body>
</html>
